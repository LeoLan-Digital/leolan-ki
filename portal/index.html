<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="canonical" href="https://ki.leolan.net/portal/">
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunden-Portal — LeoLan Digital</title>
<style>
body{margin:0;padding:20px;font-family:-apple-system,sans-serif;background:#0e1621;color:#e8eaed;min-height:100vh}
.card{background:#17212b;border-radius:16px;padding:28px;max-width:420px;margin:40px auto}
.logo{text-align:center;margin-bottom:24px}
.logo img{width:64px;height:64px;object-fit:contain}
h1{font-size:20px;font-weight:700;text-align:center;margin:0 0 4px}
p.sub{color:#8a9bb8;font-size:14px;text-align:center;margin:0 0 24px}
label{display:block;color:#8a9bb8;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
input{width:100%;background:#0e1621;color:#e8eaed;border:1px solid #2a3a4a;border-radius:10px;padding:12px;font-size:15px;box-sizing:border-box;margin-bottom:14px}
input:focus{outline:none;border-color:#5e81f4}
button{width:100%;background:#5e81f4;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.err{background:#ef444420;border:1px solid #ef4444;border-radius:8px;padding:10px;color:#ef4444;font-size:13px;margin-bottom:14px;display:none}
.info{background:#5e81f420;border:1px solid #5e81f4;border-radius:8px;padding:10px;color:#a0b4e8;font-size:13px;margin-bottom:14px;display:none}
.link{text-align:center;margin-top:16px;font-size:13px;color:#8a9bb8}
.link a{color:#5e81f4;cursor:pointer}
#otpSection{display:none}
.otp-hint{color:#8a9bb8;font-size:13px;text-align:center;margin-bottom:16px}
input#otp{font-size:28px;font-weight:700;text-align:center;letter-spacing:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="https://ki.leolan.net/leolan-logo.svg" alt="LeoLan" onerror="this.style.display='none'">
    <h1>Kunden-Portal</h1>
    <p class="sub">LeoLan Digital</p>
  </div>
  <div class="err" id="err"></div>
  <div class="info" id="info"></div>
  <div id="loginSection">
    <label>E-Mail oder Kundencode</label>
    <input type="email" id="email" placeholder="K100001 oder ihre@email.de">
    <label>Passwort</label>
    <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button id="btnLogin" onclick="login()">Einloggen</button>
    <div class="link">Noch kein Konto? <a href="/onboarding/">Jetzt registrieren →</a></div>
  </div>
  <div id="otpSection">
    <p class="otp-hint" id="otpHint">Code wurde an Ihre E-Mail gesendet.</p>
    <label>6-stelliger Code</label>
    <input type="text" id="otp" maxlength="6" placeholder="000000" onkeydown="if(event.key==='Enter')verifyOtp()">
    <button id="btnOtp" onclick="verifyOtp()">Bestätigen</button>
    <div class="link" style="margin-top:8px"><a onclick="resendOtp()" id="resendLink">Code erneut senden</a></div>
    <div class="link"><a onclick="backToLogin()">← Zurück</a></div>
  </div>
</div>
<script>
var pendingCode='';
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.style.display='block';document.getElementById('info').style.display='none';}
function showInfo(m){var i=document.getElementById('info');i.textContent=m;i.style.display='block';document.getElementById('err').style.display='none';}
function hideMsg(){document.getElementById('err').style.display='none';document.getElementById('info').style.display='none';}
function backToLogin(){document.getElementById('otpSection').style.display='none';document.getElementById('loginSection').style.display='block';pendingCode='';hideMsg();}
function login(){
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('pw').value;
  var btn=document.getElementById('btnLogin');
  hideMsg();
  if(!email||!pw){showErr('Bitte alle Felder ausfüllen.');return;}
  btn.disabled=true;btn.textContent='Wird geprüft...';
  fetch('https://n8n.leolan.net/webhook/kunden-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})})
  .then(r=>r.json()).then(data=>{
    btn.disabled=false;btn.textContent='Einloggen';
    if(data.success&&data.customerCode){
      pendingCode=data.customerCode;
      fetch('https://n8n.leolan.net/webhook/otp-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerCode:pendingCode})})
      .then(r=>r.json()).then(otpData=>{
        document.getElementById('loginSection').style.display='none';
        document.getElementById('otpSection').style.display='block';
        document.getElementById('otpHint').textContent='Code wurde an Ihre E-Mail gesendet.';
        showInfo('✓ Code gesendet — bitte E-Mail prüfen.');
        document.getElementById('otp').focus();
      }).catch(()=>{document.getElementById('loginSection').style.display='none';document.getElementById('otpSection').style.display='block';});
    } else {showErr(data.error||'Ungültige Anmeldedaten.');}
  }).catch(()=>{btn.disabled=false;btn.textContent='Einloggen';showErr('Verbindungsfehler.');});
}
function verifyOtp(){
  var otp=document.getElementById('otp').value.trim();
  var btn=document.getElementById('btnOtp');
  hideMsg();
  if(!otp||otp.length!==6){showErr('Bitte 6-stelligen Code eingeben.');return;}
  btn.disabled=true;btn.textContent='Wird geprüft...';
  fetch('https://n8n.leolan.net/webhook/otp-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerCode:pendingCode,otp:otp})})
  .then(r=>r.json()).then(data=>{
    btn.disabled=false;btn.textContent='Bestätigen';
    if(data.success){window.location.href='/portal/dashboard.html?code='+encodeURIComponent(pendingCode);}
    else{showErr(data.error||'Falscher Code. Bitte erneut versuchen.');document.getElementById('otp').value='';document.getElementById('otp').focus();}
  }).catch(()=>{btn.disabled=false;btn.textContent='Bestätigen';showErr('Verbindungsfehler.');});
}
function resendOtp(){
  var link=document.getElementById("resendLink");
  link.style.pointerEvents="none";link.style.opacity="0.4";link.textContent="Wird gesendet...";
  fetch("https://n8n.leolan.net/webhook/otp-send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerCode:pendingCode})})
  .then(r=>r.json()).then(()=>{
    showInfo("✓ Neuer Code wurde gesendet!");
    var s=60;var t=setInterval(function(){link.textContent="Erneut senden ("+s+"s)";s--;if(s<0){clearInterval(t);link.textContent="Code erneut senden";link.style.pointerEvents="auto";link.style.opacity="1";}},1000);
  }).catch(()=>{link.style.pointerEvents="auto";link.style.opacity="1";link.textContent="Code erneut senden";});
}
</script>
</body>
</html>
