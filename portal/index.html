<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunden-Portal — LeoLan Digital</title>
<style>
body{margin:0;padding:20px;font-family:-apple-system,sans-serif;background:#0e1621;color:#e8eaed;min-height:100vh}
.card{background:#17212b;border-radius:16px;padding:28px;max-width:420px;margin:40px auto}
.logo{text-align:center;margin-bottom:24px}
.logo img{width:64px;height:64px;object-fit:contain}
h1{font-size:20px;font-weight:700;text-align:center;margin:0 0 4px}
p.sub{color:#8a9bb8;font-size:14px;text-align:center;margin:0 0 24px}
label{display:block;color:#8a9bb8;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
input{width:100%;background:#0e1621;color:#e8eaed;border:1px solid #2a3a4a;border-radius:10px;padding:12px;font-size:15px;box-sizing:border-box;margin-bottom:14px}
button{width:100%;background:#5e81f4;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.err{background:#ef444420;border:1px solid #ef4444;border-radius:8px;padding:10px;color:#ef4444;font-size:13px;margin-bottom:14px;display:none}
.link{text-align:center;margin-top:16px;font-size:13px;color:#8a9bb8}
.link a{color:#5e81f4}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="https://ki.leolan.net/leolan-logo.png" alt="LeoLan" onerror="this.style.display='none'">
    <h1>Kunden-Portal</h1>
    <p class="sub">LeoLan Digital</p>
  </div>
  <div class="err" id="err"></div>
  <label>E-Mail oder Kundencode</label>
  <input type="text" id="identifier" placeholder="K100001 oder ihre@email.de">
  <label>Passwort</label>
  <input type="password" id="pw" placeholder="••••••••">
  <button id="btn" onclick="login()">Einloggen</button>
  <div class="link">
    Noch kein Konto? <a href="/onboarding/">Jetzt registrieren →</a><br>
    <a href="javascript:void(0)" onclick="forgotPw()" style="margin-top:8px;display:inline-block">Passwort vergessen?</a>
  </div>
</div>

<script>
function login() {
  var id = document.getElementById('identifier').value.trim();
  var pw = document.getElementById('pw').value;
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  err.style.display = 'none';
  if (!id || !pw) { err.textContent = 'Bitte alle Felder ausfüllen.'; err.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'Wird angemeldet...';
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://n8n.leolan.net/webhook/kunden-login', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    btn.disabled = false;
    btn.textContent = 'Einloggen';
    var data = {};
    try { data = JSON.parse(xhr.responseText); } catch(e) {}
    if (data.success && data.customerCode) {
      if (data.sectorMismatch) {
        err.textContent = data.error || 'Falscher Login-Bereich.';
        err.style.display = 'block';
      } else {
        window.location.href = '/portal/dashboard.html?code=' + encodeURIComponent(data.customerCode);
      }
    } else if (data.blocked) {
      err.textContent = 'Zu viele Versuche. Bitte 15 Minuten warten.';
      err.style.display = 'block';
    } else {
      err.textContent = data.error || 'Ungültige Anmeldedaten.';
      err.style.display = 'block';
    }
  };
  xhr.onerror = function() { btn.disabled = false; btn.textContent = 'Einloggen'; err.textContent = 'Verbindungsfehler.'; err.style.display = 'block'; };
  xhr.send(JSON.stringify({customerCode: id, email: id, password: pw}));
}
function forgotPw() {
  var email = prompt('E-Mail-Adresse eingeben:');
  if (!email) return;
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://n8n.leolan.net/webhook/kunden-dashboard', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() { alert('Falls ein Konto existiert, wurde eine E-Mail gesendet.'); };
  xhr.send(JSON.stringify({action: 'forgot-password', email: email}));
}
</script>
</body>
</html>
