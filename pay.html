<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeoLan Digital – Zahlung</title>
<style>body{background:#0d1117;color:#e6edf3;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px;text-align:center;}
.spinner{width:40px;height:40px;border:3px solid #30363d;border-top:3px solid #f5a623;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
p{color:#8b949e;font-size:14px;}</style>
</head>
<body>
<div class="spinner"></div>
<p>Weiterleitung zur sicheren Zahlung…</p>
<script>
(function(){
  var u = new URLSearchParams(window.location.search).get('u');
  if(u){
    try{
      // Support both base64url (no padding) and standard base64
      var b64 = u.replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length % 4) b64 += '=';
      window.location.replace(atob(b64));
    }
    catch(e){ window.location.replace(decodeURIComponent(u)); }
  } else {
    document.querySelector('p').textContent = 'Ungültiger Link. Bitte erneut versuchen.';
  }
})();
</script>
</body>
</html>
