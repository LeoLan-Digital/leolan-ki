<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>LeoLan Intelligence Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,sans-serif;padding:20px}
h1{font-size:20px;font-weight:700;color:#58a6ff;margin-bottom:4px}
.sub{font-size:12px;color:#8b949e;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}
.label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.value{font-size:28px;font-weight:700}
.trend{font-size:11px;margin-top:4px}
.green{color:#3fb950}.blue{color:#58a6ff}.orange{color:#d29922}.purple{color:#bc8cff}
.agents-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.agent{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-idle{background:#484f58}
.dot-active{background:#3fb950;box-shadow:0 0 6px #3fb950;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.aname{font-size:11px;font-weight:600;flex:1}
.atype{font-size:9px;color:#8b949e}
.badge{font-size:9px;padding:2px 6px;border-radius:20px}
.b-idle{background:#21262d;color:#8b949e}
.b-active{background:#1f4e2f;color:#3fb950}
.section{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin-bottom:16px}
.section h2{font-size:12px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #21262d;font-size:13px}
.row:last-child{border-bottom:none}
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-track{background:#21262d;border-radius:4px;height:8px}
.bar-fill{height:100%;border-radius:4px}
.sites{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px}
.site h3{font-size:13px;font-weight:700;margin-bottom:8px}
.log{font-size:11px;font-family:monospace;padding:3px 0;color:#8b949e}
.log-ok{color:#3fb950}.log-err{color:#f85149}
.ticker{font-size:11px;color:#8b949e;border-top:1px solid #21262d;padding-top:10px;margin-top:16px}
</style>
</head>
<body>
<h1>🐝 LeoLan Intelligence Platform</h1>
<div class="sub">Ruflo V3 · 109 Agenten + 50 Hive Workers · <span id="clock" style="color:#3fb950;font-weight:700"></span> · Auto-Refresh 30s</div>

<div class="grid">
  <div class="card"><div class="label">Agenten Total</div><div class="value blue">109</div><div class="trend green">+ 50 Hive Workers = 159</div></div>
  <div class="card"><div class="label">Autopilot</div><div class="value green">AN</div><div class="trend green">✅ 12 Cron-Jobs aktiv</div></div>
  <div class="card"><div class="label">Token-Einsparung</div><div class="value orange">83%</div><div class="trend orange">~35€/Tag statt 200€</div></div>
  <div class="card"><div class="label">Posts heute</div><div class="value purple" id="postCount">—</div><div class="trend purple" id="postStatus">lädt...</div></div>
</div>

<div class="section">
  <h2>🤖 Alle 109 Agenten — Echtzeit</h2>
  <div class="agents-grid" id="agentGrid">
